# ==========================================
# Application
# ==========================================
spring.application.name=tradewise

# ==========================================
# Server
# ==========================================
server.port=9090

# ==========================================
# PostgreSQL Database
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/tradewise_db
spring.datasource.username=${DB_USERNAME:USERNAME}
spring.datasource.password=${DB_PASSWORD:PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Error Messages
# ==========================================
server.error.include-message=always

# ==========================================
# Logging
# ==========================================
logging.level.org.springframework.security=DEBUG

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret}
jwt.expiration=3600000

# ==========================================
# Upstox API
# ==========================================
upstocks.api.base-url=${UPSTOX_API_BASE_URL:replace-with-upstox-base-url}
upstocks.api.key=${UPSTOX_ACCESS_TOKEN}

# ==========================================
# Groww API
# ==========================================
groww.api.base-url=${GROWW_API_BASE_URL:replace-with-groww-base-url}
groww.api.access.token=${GROWW_API_ACCESS_TOKEN}